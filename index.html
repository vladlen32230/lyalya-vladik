<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Это Ляля и Владик!</title>
<meta name="description" content="Это Ляля и Владик!">
<meta property="og:title" content="Это Ляля и Владик!">
<meta property="og:type" content="video.other">
<meta property="og:image" content="media/poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1733;
    --rose:#ff6b9d;
    --violet:#8b5cf6;
    --gold:#ffd166;
    --card:rgba(255,255,255,.72);
    --stroke:rgba(255,255,255,.65);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 700px at 12% -10%, #ffe3f1 0%, transparent 60%),
      radial-gradient(900px 600px at 95% 5%, #e7dcff 0%, transparent 60%),
      radial-gradient(900px 700px at 50% 115%, #ffeccf 0%, transparent 60%),
      linear-gradient(160deg,#fff6fb 0%,#f6f0ff 55%,#fff8ef 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(20px,5vw,56px) 18px 40px;
    overflow-x:hidden;
  }

  /* floating hearts */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hearts span{
    position:absolute;bottom:-8vh;font-size:var(--s,18px);opacity:0;
    animation:rise var(--d,16s) linear var(--delay,0s) infinite;
    filter:drop-shadow(0 4px 10px rgba(255,107,157,.25));
  }
  @keyframes rise{
    0%{transform:translateY(0) rotate(0deg) scale(.8);opacity:0}
    12%{opacity:.85}
    85%{opacity:.6}
    100%{transform:translateY(-118vh) rotate(var(--r,180deg)) scale(1.15);opacity:0}
  }

  .wrap{position:relative;z-index:1;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:clamp(22px,4vw,38px)}

  header{text-align:center}
  .kicker{
    display:inline-flex;align-items:center;gap:.5rem;
    font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    color:#8a5a86;background:var(--card);border:1px solid var(--stroke);
    padding:.45rem 1rem;border-radius:999px;backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(139,92,246,.12);
  }
  h1{
    font-family:'Comfortaa',cursive,sans-serif;font-weight:700;
    font-size:clamp(2.1rem,7.5vw,4rem);line-height:1.12;
    margin:.55em 0 0;letter-spacing:-.01em;
    background:linear-gradient(100deg,var(--rose) 0%,var(--violet) 48%,#ff8a5c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% 100%;animation:shimmer 9s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .rule{
    margin:1.1rem auto 0;width:min(240px,60%);height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--rose),var(--violet),transparent);
    opacity:.75;
  }

  /* video card */
  .stage{position:relative;width:100%;max-width:560px}
  .stage::before{
    content:"";position:absolute;inset:-14px;border-radius:38px;z-index:-1;
    background:linear-gradient(130deg,var(--rose),var(--violet),var(--gold),var(--rose));
    background-size:300% 300%;filter:blur(22px);opacity:.55;
    animation:glow 12s ease infinite;
  }
  @keyframes glow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .frame{
    border-radius:28px;overflow:hidden;background:#1b0f22;
    border:1px solid var(--stroke);
    box-shadow:0 26px 60px -18px rgba(90,40,110,.45),0 2px 0 rgba(255,255,255,.7) inset;
    aspect-ratio:1/1;
  }
  video{display:block;width:100%;height:100%;object-fit:cover;background:#1b0f22}

  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  button{
    font:inherit;font-weight:600;cursor:pointer;
    border:1px solid var(--stroke);border-radius:999px;
    padding:.6rem 1.15rem;color:#5d2f5a;
    background:var(--card);backdrop-filter:blur(8px);
    box-shadow:0 6px 18px rgba(139,92,246,.14);
    transition:transform .18s ease,box-shadow .18s ease,color .18s ease;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(139,92,246,.22);color:#3f1d44}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:2px solid var(--violet);outline-offset:3px}

  footer{text-align:center;color:#8a6d8d;font-size:.9rem;padding-top:6px}
  footer .dot{color:var(--rose);margin:0 .4rem}

  @media (prefers-reduced-motion:reduce){
    .hearts{display:none}
    h1,.stage::before{animation:none}
  }
</style>
</head>
<body>

<div class="hearts" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <span class="kicker">♥ наша страничка</span>
    <h1>Это Ляля и Владик!</h1>
    <div class="rule"></div>
  </header>

  <main class="stage">
    <div class="frame">
      <video id="v" src="media/video.mp4" poster="media/poster.jpg"
             controls loop muted playsinline preload="metadata"></video>
    </div>
    <div class="controls">
      <button id="sound" type="button">🔊 Включить звук</button>
      <button id="replay" type="button">↻ Сначала</button>
    </div>
  </main>

  <footer>Сделано с любовью <span class="dot">♥</span> 2026</footer>
</div>

<script>
  // floating hearts
  (function(){
    var box = document.querySelector('.hearts');
    if (!box || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var glyphs = ['♥','💗','✨','💜','🤍'];
    for (var i = 0; i < 18; i++){
      var s = document.createElement('span');
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = (Math.random() * 98) + 'vw';
      s.style.setProperty('--s', (14 + Math.random() * 22).toFixed(0) + 'px');
      s.style.setProperty('--d', (13 + Math.random() * 12).toFixed(1) + 's');
      s.style.setProperty('--delay', (-Math.random() * 20).toFixed(1) + 's');
      s.style.setProperty('--r', (Math.random() * 360 - 180).toFixed(0) + 'deg');
      box.appendChild(s);
    }
  })();

  // autoplay muted (allowed), with a button to unmute on user gesture
  (function(){
    var v = document.getElementById('v');
    var sound = document.getElementById('sound');
    var replay = document.getElementById('replay');

    var p = v.play();
    if (p && p.catch) p.catch(function(){ /* autoplay blocked: poster + controls remain */ });

    function label(){
      sound.textContent = v.muted ? '🔊 Включить звук' : '🔇 Выключить звук';
    }
    sound.addEventListener('click', function(){
      v.muted = !v.muted;
      if (!v.muted) v.play().catch(function(){});
      label();
    });
    v.addEventListener('volumechange', label);
    replay.addEventListener('click', function(){
      v.currentTime = 0;
      v.play().catch(function(){});
    });
    label();
  })();
</script>
</body>
</html>
